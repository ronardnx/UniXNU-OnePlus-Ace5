name: Ace 5 iOS16 XNU UFS USB
on:
  workflow_dispatch:
    inputs:
      profile:
        description: GUI builds produce a kernel for local packaging with the verified product ADT
        type: choice
        required: true
        default: base
        options:
          - base
          - gui
      touch:
        description: Include the opt-in Ace 5 hardware touch driver (requires GUI)
        type: boolean
        default: false
      wifi:
        description: Include WCN7850 runtime and IO80211 passive scans (requires GUI; firmware stays local)
        type: boolean
        default: false
permissions:
  contents: read
env:
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xyyyds0106/ios-vermeer-lab
          ref: d68e05df683f863f054b0f9c063c54d2b1342b2a
          path: reference
      - name: Validate SM8650 context isolation
        run: |
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_smmu.c -o /tmp/smmu-test
          /tmp/smmu-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_touch_reports.c -o /tmp/touch-report-test
          /tmp/touch-report-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_touch_wire.c -o /tmp/touch-wire-test
          /tmp/touch-wire-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_touch_gpio.c -o /tmp/touch-gpio-test
          /tmp/touch-gpio-test
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_trust_catalog.c -o /tmp/trust-test
          /tmp/trust-test < /dev/null
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined tests/ios16_log_bytes.c -o /tmp/log-test
          /tmp/log-test
          bash scripts/test-ios16-wifi-runtime.sh
          python3 tests/ios16_wifi_embed.py
      - name: Prepare pinned XNU build and Ace 5 profile
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          python3 reference/tools/strict_profile_patches.py dxb/build.sh
          python3 scripts/prepare-ios16.py --reference reference --work profile-source --out profile ${{ inputs.profile == 'gui' && '--gui' || '' }} ${{ inputs.touch && '--touch' || '' }} ${{ inputs.wifi && '--wifi' || '' }}
          clang -std=c11 -Wall -Wextra -Werror -fsanitize=address,undefined -I profile-source/vermeer tests/ios16_dma.c -o /tmp/dma-test
          /tmp/dma-test
          python3 scripts/make-ios16-adt.py --reference reference --out profile/giulia-ios16.adt
          python3 tests/ios16_rebase.py reference
          cp profile/*.patch profile/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
      - name: Select compatible Xcode and dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build kernel
        working-directory: dxb
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../xnu-build.log
      - name: Verify linked services
        run: |
          python3 profile/check-kernel.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet ${{ inputs.profile == 'gui' && '--gui' || '' }}
          python3 tests/ios16_platform_match.py --reference reference --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          if [ '${{ inputs.touch }}' = true ]; then
            python3 -c "from pathlib import Path; assert b'GIULIA TOUCH: controller result=' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
          fi
          if [ '${{ inputs.profile }}' = gui ]; then
            python3 -c "from pathlib import Path; assert b'GIULIA AMFI: trust catalogue ready;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; assert b'GIULIA LOG: launchd full activity/stderr logging enabled;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; assert b'GIULIA FB: native panel 1264x2780 full coverage;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
          fi
          if [ '${{ inputs.wifi }}' = true ]; then
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA WIFI: PCIe/MHI/QMI/WMI ready;' in b; assert b'IO80211Controller' in b and b'GiuliaWiFiUserClient' in b"
          fi
      - name: Prepare DarwinBoot kernel pointers
        run: python3 scripts/ios16-rebase.py --reference reference --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet --out profile/kernel.macho
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace5-ios16-xnu
          path: |
            dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
            xnu-build.log
            profile/
          retention-days: 14
  boot-image:
    if: ${{ inputs.profile != 'gui' }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      GIULIA_BOOT_ABI: darwin22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ace5-ios16-xnu
          path: kernel-artifact
      - name: Install UEFI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-venv clang llvm lld uuid-dev nasm gcc-aarch64-linux-gnu acpica-tools device-tree-compiler mono-devel ca-certificates-mono mtools
      - name: Make matching FAT payload
        run: |
          python3 scripts/make-ios16-payload.py --kernel kernel-artifact/profile/kernel.macho --adt kernel-artifact/profile/giulia-ios16.adt --out "$RUNNER_TEMP/ios16-payload"
          python3 scripts/verify-payload.py "$RUNNER_TEMP/ios16-payload"
      - name: Build iOS16 UEFI with this payload identity
        run: |
          set -o pipefail
          export GIULIA_PAYLOAD_IDENTITY="$RUNNER_TEMP/ios16-payload/identity.json"
          bash scripts/build-uefi.sh "$RUNNER_TEMP/ace5-ios16" 2>&1 | tee uefi-build.log
      - name: Pack temporary boot v3 image
        run: |
          python3 scripts/pack-payload.py --firmware "$RUNNER_TEMP/ace5-ios16/uefi-giulia/Mu-giulia-0.img" --firmware-report "$RUNNER_TEMP/ace5-ios16/image-verification.json" --payload "$RUNNER_TEMP/ios16-payload/payload.img" --payload-report "$RUNNER_TEMP/ios16-payload/payload.json" --header-version 3 --output "$RUNNER_TEMP/giulia-ios16-ufs-usb.img"
      - uses: actions/upload-artifact@v4
        with:
          name: giulia-ios16-ufs-usb
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/giulia-ios16-ufs-usb.img
            ${{ runner.temp }}/giulia-ios16-ufs-usb.json
            ${{ runner.temp }}/ios16-payload/payload.json
            ${{ runner.temp }}/ios16-payload/identity.json
            kernel-artifact/profile/capture-debug.ps1
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-boot-build-log
          path: uefi-build.log
          retention-days: 14
