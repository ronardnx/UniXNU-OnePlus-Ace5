name: Ace 5 iOS16 XNU UFS USB
on:
  workflow_dispatch:
    inputs:
      profile:
        description: GUI builds produce a kernel for local packaging with the verified product ADT
        type: choice
        required: true
        default: base
        options:
          - base
          - gui
      touch:
        description: Include the opt-in Ace 5 hardware touch driver (requires GUI)
        type: boolean
        default: false
      wifi:
        description: Include WCN7850 runtime and IO80211 passive scans (requires GUI; firmware stays local)
        type: boolean
        default: false
      gpu:
        description: Include A750 firmware/RAM preparation and gated observation (requires GUI; firmware stays local)
        type: boolean
        default: false
      audio:
        description: Include experimental audio coordinator (requires GUI; native platform provider incomplete)
        type: boolean
        default: false
      modem:
        description: Include the unified modem framework and shared platform resource broker (requires GUI)
        type: boolean
        default: false
      hotload:
        description: Compile NLH2, 15 core policies and selected real protocol-module scenarios (no UEFI image)
        type: boolean
        default: false
permissions:
  contents: read
env:
  MACOS_VERSION: '13.5'
  KERNEL_CONFIG: DEVELOPMENT
  MACHINE_CONFIG: SWEET
jobs:
  hotload-modules:
    if: ${{ github.repository_owner == 'tycykp' && inputs.hotload }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify the committed common-kit snapshot
        env:
          GPU: ${{ inputs.gpu }}
          WIFI: ${{ inputs.wifi }}
          AUDIO: ${{ inputs.audio }}
          MODEM: ${{ inputs.modem }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          root = Path('ci-source/NativeHotload')
          snapshot = json.loads(Path('ci-source/native-hotload-source.json').read_text())
          actual = {p.relative_to(root).as_posix(): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in sorted(root.rglob('*')) if p.is_file() and '__pycache__' not in p.parts}
          if (snapshot['schema'] != 1 or snapshot['canonical_source'] != 'UniXNU/kits/NativeHotload'
                  or not actual or snapshot['files'] != actual):
              raise ValueError('NativeHotload snapshot differs from its recorded common-kit source')
          out = Path('out')
          out.mkdir()
          (out / 'native-hotload-source.json').write_text(json.dumps(snapshot, indent=2) + '\n')
          build = {'schema': 1, 'repository': os.environ['GITHUB_REPOSITORY'],
                   'commit': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
                   'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'], 'hardware_tested': False,
                   'requested_domains': sorted(name for name in ('gpu', 'wifi', 'audio', 'modem')
                                               if os.environ[name.upper()] == 'true'),
                   'hardware_validated': False}
          build['hardware_protocol_suite_requested'] = bool(build['requested_domains'])
          (out / 'hotload-build.json').write_text(json.dumps(build, indent=2) + '\n')
          PY
      - name: Install ARM64 module compiler and linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Build all core-policy module scenarios
        run: |
          set -o pipefail
          clang --version
          ld.lld --version
          python3 ci-source/NativeHotload/build-core.py --out out/hotload-core 2>&1 | tee out/hotload-modules.log
      - name: Build selected real hardware protocol scenarios
        if: ${{ inputs.gpu || inputs.wifi || inputs.audio || inputs.modem }}
        run: |
          set -o pipefail
          domains=()
          if [ '${{ inputs.gpu }}' = true ]; then domains+=(gpu); fi
          if [ '${{ inputs.wifi }}' = true ]; then domains+=(wifi); fi
          if [ '${{ inputs.audio }}' = true ]; then domains+=(audio); fi
          if [ '${{ inputs.modem }}' = true ]; then domains+=(modem); fi
          python3 scripts/build-hotload-protocols.py --kit ci-source/NativeHotload --out out/hotload-protocols --source-snapshot ci-source/native-hotload-source.json --domains "${domains[@]}" 2>&1 | tee out/hotload-protocols.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace5-ios16-hotload-modules
          path: |
            out/hotload-core/
            out/hotload-protocols/
            out/native-hotload-source.json
            out/hotload-build.json
            out/hotload-modules.log
            out/hotload-protocols.log
          retention-days: 14
  build:
    needs: hotload-modules
    if: ${{ always() && !cancelled() && github.repository_owner == 'tycykp' && (!inputs.hotload || needs.hotload-modules.result == 'success') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate requested profile
        env:
          PROFILE: ${{ inputs.profile }}
          TOUCH: ${{ inputs.touch }}
          WIFI: ${{ inputs.wifi }}
          GPU: ${{ inputs.gpu }}
          AUDIO: ${{ inputs.audio }}
          MODEM: ${{ inputs.modem }}
        run: |
          if [ "$PROFILE" != gui ] && { [ "$TOUCH" = true ] || [ "$WIFI" = true ] || [ "$GPU" = true ] || [ "$AUDIO" = true ] || [ "$MODEM" = true ]; }; then
            echo 'Touch, Wi-Fi, GPU, audio and modem require the GUI profile' >&2
            exit 2
          fi
      - uses: actions/checkout@v4
        with:
          repository: xyyyds0106/ios-vermeer-lab
          ref: d68e05df683f863f054b0f9c063c54d2b1342b2a
          path: reference
      - name: Check driver module boundaries
        run: python3 scripts/check-driver-modules.py
      - uses: actions/download-artifact@v4
        if: ${{ inputs.hotload }}
        with:
          name: ace5-ios16-hotload-modules
          path: hotload-artifact
      - name: Prepare pinned XNU build and Ace 5 profile
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          python3 reference/tools/strict_profile_patches.py dxb/build.sh
          hotload_args=()
          if [ '${{ inputs.hotload }}' = true ]; then
            hotload_args+=(--hotload-source "$GITHUB_WORKSPACE/ci-source/NativeHotload")
          fi
          python3 scripts/prepare-ios16.py --reference reference --work profile-source --out profile ${{ inputs.profile == 'gui' && '--gui' || '' }} ${{ inputs.touch && '--touch' || '' }} ${{ inputs.wifi && '--wifi' || '' }} ${{ inputs.gpu && '--gpu' || '' }} ${{ inputs.audio && '--audio' || '' }} ${{ inputs.modem && '--modem' || '' }} "${hotload_args[@]}"
          python3 scripts/make-ios16-adt.py --reference reference --out profile/giulia-ios16.adt
          cp profile/*.patch profile/*.sh dxb/patches/
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
      - name: Verify module and resident-runtime source agreement
        if: ${{ inputs.hotload }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path
          kit = Path('ci-source/NativeHotload')
          sys.path.insert(0, str(kit))
          from nlh_format import CORE_MODULES, parse_image
          artifact = Path('hotload-artifact')
          snapshot = json.loads((artifact / 'native-hotload-source.json').read_text())
          if snapshot != json.loads(Path('ci-source/native-hotload-source.json').read_text()):
              raise ValueError('Module and kernel jobs used different common-kit snapshots')
          build = json.loads((artifact / 'hotload-build.json').read_text())
          if (build['commit'] != os.environ['GITHUB_SHA']
                  or build['run_id'] != os.environ['GITHUB_RUN_ID']
                  or build['run_attempt'] != os.environ['GITHUB_RUN_ATTEMPT']):
              raise ValueError('Modules must come from this workflow run and source commit')
          runtime = json.loads(Path('profile/hotload-module.json').read_text())
          suite = json.loads((artifact / 'hotload-core/core-suite.json').read_text())
          for manifest in (runtime['files'], suite['inputs']):
              for name, digest in manifest.items():
                  if snapshot['files'].get(name) != digest:
                      raise ValueError('Runtime/module source mismatch: ' + name)
          expected = {(name, variant) for name in CORE_MODULES
                      for variant in ('baseline', 'upgrade', 'fail-start', 'fail-import', 'fail-stop')}
          found = set()
          for entry in suite['artifacts']:
              key = (entry['name'], entry['variant'])
              if key in found or key not in expected:
                  raise ValueError('Duplicate or unexpected core-policy module')
              found.add(key)
              image = (artifact / 'hotload-core' / entry['image']).read_bytes()
              parsed = parse_image(image)
              if (any(entry.get(name) != value for name, value in parsed.items())
                      or hashlib.sha256(image).hexdigest() != entry['image_sha256']):
                  raise ValueError('Module artifact differs from suite manifest')
              module = json.loads((artifact / 'hotload-core' / entry['module_manifest']).read_text())
              if module['image_sha256'] != entry['image_sha256']:
                  raise ValueError('Module image digest differs from build manifest')
              for name, digest in module['kit_inputs'].items():
                  if snapshot['files'].get(name) != digest:
                      raise ValueError('Module build input mismatch: ' + name)
          if found != expected:
              raise ValueError('Expected all 15 core-policy module images')
          report = {'schema': 1, 'commit': build['commit'], 'module_images': len(found),
                    'kernel_pin': suite['kernel_pin'], 'source_agreement': True,
                    'hardware_tested': False}
          Path('profile/hotload-module-check.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
      - name: Verify real protocol artifacts against the resident gateway
        if: ${{ inputs.hotload }}
        run: |
          domains=()
          if [ '${{ inputs.gpu }}' = true ]; then domains+=(gpu); fi
          if [ '${{ inputs.wifi }}' = true ]; then domains+=(wifi); fi
          if [ '${{ inputs.audio }}' = true ]; then domains+=(audio); fi
          if [ '${{ inputs.modem }}' = true ]; then domains+=(modem); fi
          if [ "${#domains[@]}" -gt 0 ]; then
            python3 scripts/build-hotload-protocols.py --kit ci-source/NativeHotload --resident-manifest profile/hotload-module.json --verify-suite hotload-artifact/hotload-protocols/protocol-suite.json --domains "${domains[@]}" --report profile/hotload-protocol-check.json
          else
            python3 - <<'PY'
          import json
          from pathlib import Path
          build = json.loads(Path('hotload-artifact/hotload-build.json').read_text())
          runtime = json.loads(Path('profile/hotload-module.json').read_text())
          if (runtime.get('gateway_selected') != [] or build.get('requested_domains') != []
                  or build.get('hardware_protocol_suite_requested') is not False
                  or build.get('hardware_validated') is not False):
              raise ValueError('Core-only build must not claim a hardware protocol suite')
          report = {'schema': 1, 'status': 'not-requested', 'requested_domains': [],
                    'module_images': 0, 'hardware_protocol_suite_requested': False,
                    'hardware_tested': False, 'hardware_validated': False}
          Path('profile/hotload-protocol-check.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report, indent=2))
          PY
          fi
      - name: Select compatible Xcode and dependencies
        run: |
          brew install jq gum bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
      - name: Build kernel
        working-directory: dxb
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../xnu-build.log
      - name: Verify linked services
        run: |
          python3 profile/check-kernel.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet ${{ inputs.profile == 'gui' && '--gui' || '' }}
          python3 scripts/fix-ios16-high-physical-cache.py --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet --check
          python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert all(m in b for m in (b'GIULIA SHELL: /dev/giulia-debug ready;',b'GIULIA REG: mapped slot=',b'GIULIA TERM: protocol=2'))"
          if [ '${{ inputs.touch }}' = true ]; then
            python3 -c "from pathlib import Path; assert b'GIULIA TOUCH: controller result=' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
          fi
          if [ '${{ inputs.profile }}' = gui ]; then
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA DISPLAY POWER: request=' in b and b'GiuliaDisplayPowerFrozen' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert all(m in b for m in (b'GIULIA KEYS: observer polling active',b'GIULIA KEYS: compiled=1',b'GIULIA SLIDER: compiled=1',b'keys.status',b'slider.status'))"
            python3 -c "from pathlib import Path; assert b'GIULIA AMFI: trust catalogue ready;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; assert b'GIULIA LOG: launchd full activity/stderr logging enabled;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; assert b'GIULIA FB: native panel 1264x2780 full coverage;' in Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA SCREEN: panel capture lock unavailable' in b and b'GIULIA SCREEN: queued live=' in b"
          fi
          if [ '${{ inputs.wifi }}' = true ]; then
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA WIFI: PCIe/MHI/QMI/WMI ready;' in b; assert b'IO80211Controller' in b and b'GiuliaWiFiUserClient' in b; assert b'GIULIA WIFI PROFILE: 20H392; station=1; legacy20=1; security=open,wpa2,sae-pmf; data=htt-tcl-reo' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert all(m in b for m in (b'GIULIA WIFI: XNU PCIe link worker',b'giulia_wifip',b'sw-ctrl-pdc-route',b'GWL_LINK_TIMEOUT'))"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA PCI: enumerate result=' in b and b'cap_reason=' in b"
            python3 -c "from pathlib import Path; b=Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes(); assert b'GIULIA WIFI: awaiting wifi.start before DMA setup' in b and b'GIULIA SMMU: write-request' in b"
          fi
          if [ '${{ inputs.gpu }}' = true ]; then
            python3 scripts/check-ios16-gpu-kernel.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          fi
          if [ '${{ inputs.modem }}' = true ]; then
            python3 -c "import sys; sys.path.insert(0,'scripts'); from pathlib import Path; from ios16_modem import kernel_declaration; d=kernel_declaration(Path('dxb/fakeroot/System/Library/Kernels/kernel.development.sweet').read_bytes()); assert d['modem_runtime_included'] and d['modem_platform_broker_included']"
          fi
          if [ '${{ inputs.hotload }}' = true ]; then
            python3 scripts/check-ios16-hotload-kernel.py dxb/fakeroot/System/Library/Kernels/kernel.development.sweet --manifest profile/hotload-module.json --source ci-source/NativeHotload --report profile/hotload-kernel-check.json
          fi
      - name: Prepare DarwinBoot kernel pointers
        run: python3 scripts/ios16-rebase.py --reference reference --kernel dxb/fakeroot/System/Library/Kernels/kernel.development.sweet --out profile/kernel.macho
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ace5-ios16-xnu
          path: |
            dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
            xnu-build.log
            profile/
            hotload-artifact/
          retention-days: 14
  boot-image:
    if: ${{ github.repository_owner == 'tycykp' && (inputs.profile != 'gui') && !inputs.hotload }}
    needs: build
    runs-on: ubuntu-24.04
    env:
      GIULIA_BOOT_ABI: darwin22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ace5-ios16-xnu
          path: kernel-artifact
      - name: Install UEFI and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3-venv clang llvm lld uuid-dev nasm gcc-aarch64-linux-gnu acpica-tools device-tree-compiler mono-devel ca-certificates-mono mtools
      - name: Make matching FAT payload
        run: |
          python3 scripts/make-ios16-payload.py --kernel kernel-artifact/profile/kernel.macho --adt kernel-artifact/profile/giulia-ios16.adt --out "$RUNNER_TEMP/ios16-payload"
          python3 scripts/verify-payload.py "$RUNNER_TEMP/ios16-payload"
      - name: Build iOS16 UEFI with this payload identity
        run: |
          set -o pipefail
          export GIULIA_PAYLOAD_IDENTITY="$RUNNER_TEMP/ios16-payload/identity.json"
          bash scripts/build-uefi.sh "$RUNNER_TEMP/ace5-ios16" 2>&1 | tee uefi-build.log
      - name: Pack temporary boot v3 image
        run: |
          python3 scripts/pack-payload.py --firmware "$RUNNER_TEMP/ace5-ios16/uefi-giulia/Mu-giulia-0.img" --firmware-report "$RUNNER_TEMP/ace5-ios16/image-verification.json" --payload "$RUNNER_TEMP/ios16-payload/payload.img" --payload-report "$RUNNER_TEMP/ios16-payload/payload.json" --header-version 3 --output "$RUNNER_TEMP/giulia-ios16-ufs-usb.img"
      - uses: actions/upload-artifact@v4
        with:
          name: giulia-ios16-ufs-usb
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/giulia-ios16-ufs-usb.img
            ${{ runner.temp }}/giulia-ios16-ufs-usb.json
            ${{ runner.temp }}/ios16-payload/payload.json
            ${{ runner.temp }}/ios16-payload/identity.json
            kernel-artifact/profile/capture-debug.ps1
            kernel-artifact/profile/debug-terminal.cmd
            kernel-artifact/profile/debug_terminal.py
            kernel-artifact/profile/terminal-requirements.txt
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios16-boot-build-log
          path: uefi-build.log
          retention-days: 14
