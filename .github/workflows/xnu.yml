name: Ace 5 XNU first entry
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      JOBS: 3
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compute kernel firmware cache key
        id: firmware-key
        run: python3 scripts/firmware-cache.py key --group kernel
      - name: Restore kernel firmware cache
        id: firmware-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/kernel-ipsw
          key: ${{ steps.firmware-key.outputs.key }}
      - name: Prepare host tools
        run: |
          brew install cmake ninja unifdef llvm lld mtools dtc
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Check first-entry device tree
        run: python3 -m unittest discover -s tests -v
      - name: Build XNU and first-entry payload
        env:
          GH_TOKEN: ${{ github.token }}
          UNIXNU_IPSW_CACHE: ${{ runner.temp }}/kernel-ipsw
        shell: bash
        run: |
          set -o pipefail
          bash scripts/build-xnu.sh "$RUNNER_TEMP/ace5-xnu" 2>&1 | tee xnu-build.log
      - name: Validate downloaded kernel firmware for caching
        if: ${{ !cancelled() }}
        id: firmware-valid
        run: python3 scripts/firmware-cache.py validate-kernel --cache "$RUNNER_TEMP/kernel-ipsw"
      - name: Save verified kernel firmware even if later build steps failed
        if: ${{ !cancelled() && steps.firmware-valid.outputs.valid == 'true' && steps.firmware-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/kernel-ipsw
          key: ${{ steps.firmware-key.outputs.key }}
      - name: Upload first-entry kernel and payload
        uses: actions/upload-artifact@v4
        with:
          name: giulia-xnu-first-entry
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/ace5-xnu/UniXNU/out/giulia/kernel/
            ${{ runner.temp }}/ace5-xnu/UniXNU/out/giulia/payload/
            board.toml
            configs/giulia_defconfig
            unixnu.lock
          retention-days: 14
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xnu-build-logs
          path: |
            xnu-build.log
            ${{ runner.temp }}/ace5-xnu/bootstrap.log
            ${{ runner.temp }}/ace5-xnu/UniXNU/out/giulia/logs/
          retention-days: 14
